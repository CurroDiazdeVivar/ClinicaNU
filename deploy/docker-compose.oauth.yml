services:
  oauth-provider:
    image: ghcr.io/njfamirm/decap-cms-github-backend:1.2.0
    container_name: oauth-provider
    environment:
      OAUTH_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      DOMAIN: https://prueba.clinicanuriaugarte.es
      OAUTH_GITHUB_SCOPE: public_repo
    networks:
      - vuelta-ciclista-vps_vuelta-net
    restart: unless-stopped

networks:
  vuelta-ciclista-vps_vuelta-net:
    external: true
