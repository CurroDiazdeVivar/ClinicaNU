backend:
  name: github
  repo: CurroDiazdeVivar/ClinicaNU
  branch: main
  base_url: https://prueba.clinicanuriaugarte.es
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ============ GRUPO 1: PÁGINAS ============
  - name: "pages"
    label: "Páginas"
    description: "Contenido de las páginas principales"
    files:
      - name: "home"
        label: "Página de Inicio"
        file: "src/content/pages/home.md"
        fields:
          - { name: "hero_title", label: "Título Hero", widget: "string" }
          - { name: "hero_subtitle", label: "Subtítulo Hero", widget: "text" }
          - { name: "hero_cta", label: "CTA Hero", widget: "string", default: "Reserva tu primera consulta" }
          - { name: "diff_1_title", label: "Texto diferenciación 1", widget: "string" }
          - { name: "diff_1_text", label: "Texto diferenciación 1 (detalle)", widget: "text" }
          - { name: "diff_2_title", label: "Texto diferenciación 2", widget: "string" }
          - { name: "diff_2_text", label: "Texto diferenciación 2 (detalle)", widget: "text" }
          - { name: "diff_3_title", label: "Texto diferenciación 3", widget: "string" }
          - { name: "diff_3_text", label: "Texto diferenciación 3 (detalle)", widget: "text" }
          - { name: "about_text", label: "Sobre la Dra.", widget: "markdown" }

  - name: "secciones"
    label: "Secciones"
    folder: "src/content/secciones"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 2: NUTRICIÓN ============
  - name: "nutricion"
    label: "Nutrición"
    folder: "src/content/nutricion"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 3: ONCOLOGÍA ============
  - name: "oncologia"
    label: "Oncología y Cuidados"
    folder: "src/content/oncologia"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 4: MEDICINA CAPILAR ============
  - name: "capilar"
    label: "Medicina Capilar"
    folder: "src/content/capilar"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 5: TECNOLOGÍA ============
  - name: "tecnologia"
    label: "Tecnología"
    folder: "src/content/tecnologia"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 6: TESTIMONIOS ============
  - name: "testimonios"
    label: "Testimonios"
    folder: "src/content/testimonios"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 7: TRATAMIENTOS ============
  - name: "tratamientos"
    label: "Tratamientos"
    folder: "src/content/tratamientos"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "categoria", label: "Categoría", widget: "select", options: ["facial", "corporal", "laser"] }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "order", label: "Orden", widget: "number", required: false }
      - { name: "image", label: "Imagen (URL)", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  # ============ GRUPO 8: BLOG Y SERVICIOS ============
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "date", label: "Fecha", widget: "datetime" }
      - { name: "author", label: "Autor", widget: "string", default: "Dra. Nuria Ugarte" }
      - { name: "excerpt", label: "Resumen", widget: "text" }
      - { name: "image", label: "Imagen destacada", widget: "image", required: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  - name: "servicios"
    label: "Servicios"
    folder: "src/content/servicios"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título del servicio", widget: "string" }
      - { name: "description", label: "Descripción breve", widget: "text" }
      - { name: "icon", label: "Icono (emoji)", widget: "string" }
      - { name: "body", label: "Contenido", widget: "markdown" }
