      - { label: "Descripción breve", name: "description", widget: "text" }
      - { label: "Icono (emoji)", name: "icon", widget: "string" }
      - { label: "Orden", name: "order", widget: "number", required: false }
      - { label: "Imagen (URL)", name: "image", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

